[project]
name = "felix"
version = "0.1.0"
description = "Point Felix at a Salesforce org and learn which constraints will break an AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Chung" }]
keywords = ["salesforce", "ai-agents", "validation-rules", "evals", "crm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer",
    "rich",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[project.urls]
Homepage = "https://github.com/eric-huychung/fixit_felix"
Repository = "https://github.com/eric-huychung/fixit_felix"
Issues = "https://github.com/eric-huychung/fixit_felix/issues"
Changelog = "https://github.com/eric-huychung/fixit_felix/blob/main/CHANGELOG.md"

[project.scripts]
felix = "felix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["felix"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "live: hits a real Salesforce org; skipped by default",
]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.coverage.run]
source = ["felix"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private state deliberately to assert on internals.
"tests/**" = ["SLF001"]
# Typer declares CLI options as call-valued argument defaults; that is the API.
"felix/cli.py" = ["B008"]
